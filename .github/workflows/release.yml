name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-linux:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.12 and Tk (Ubuntu 24.04, glibc 2.39)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3.12 python3.12-venv python3.12-tk

      - name: Report build glibc
        run: ldd --version | head -n 1

      - name: Install Python dependencies
        run: make PYTHON_CMD=python3.12 install

      - name: Build with PyInstaller
        run: make PYTHON_CMD=python3.12 build

      - name: Rename binary with platform prefix
        shell: bash
        run: mv dist/b3-selic-pre dist/b3-selic-pre-linux

      - uses: actions/upload-artifact@v7
        with:
          name: b3-selic-pre-linux
          path: dist/b3-selic-pre-linux

  build-desktop:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact_name: b3-selic-pre-windows.exe
          - os: macos-26
            artifact_name: b3-selic-pre-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: make install

      - name: Build with PyInstaller
        run: make build

      - name: Rename binary with platform prefix
        shell: bash
        run: |
          mv dist/b3-selic-pre "dist/${{ matrix.artifact_name }}" 2>/dev/null || true
          mv dist/b3-selic-pre.app "dist/${{ matrix.artifact_name }}.app" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}*

  release:
    needs: [build-linux, build-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: b3-selic-pre-*/*
          body_path: CHANGELOG.md

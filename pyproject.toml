[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b3-selic-pre"
version = "1.0.1"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.11.2",
    "Pillow>=13.0.0",
    "pyxclip>=0.2.3",
    "numpy>=2.5.4",
    "tkcalendar>=1.6.1",
]

[project.scripts]
b3-selic-pre = "b3_selic_pre.presentation.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.17.2",
    "flake8>=7.4.1",
    "flake8-bugbear>=26.9.30",
    "flake8-annotations>=3.3.0",
    "flake8-docstrings>=1.7.0",
]
quality = [
    "ruff==0.17.2",
    "flake8>=7.4.1",
    "flake8-bugbear>=26.9.30",
    "flake8-annotations>=3.3.0",
    "flake8-docstrings>=1.7.0",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "lizard>=1.24.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "mutmut>=3.8.0",
    "semgrep>=1.182.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
b3_selic_pre = ["icons/*.png"]

[tool.ruff.lint]
ignore = ["BLE001", "S110", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: deselected by default via addopts",
    "ui: test requires a display/Tk and must be counted by the UI test budget",
]
addopts = ["-m", "not slow"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/b3_selic_pre/presentation/gui/*",
    "src/b3_selic_pre/icons/*",
]

[tool.coverage.report]
fail_under = 85

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["-m", "not slow", "tests/"]
pytest_add_cli_args = ["-q", "--disable-warnings"]
runner = "pytest"
do_not_mutate = [
    "__init__.py",
    "src/tests/*",
    "tests/*",
    ".*/*",
    "build/*",
    "src/b3_selic_pre/presentation/gui/*",
    "src/b3_selic_pre/icons/*",
]
do_not_mutate_patterns = ['logger\.\w+', 'raise \w+']
#mutate_only_covered_lines = true
on_dependency_change = "rerun"
timeout_constant = 1
timeout_multiplier = 10
